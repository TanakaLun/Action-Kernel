name: Build IPSET Kernel Modules

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libncurses-dev libssl-dev bc flex bison libelf-dev tree dos2unix ccache python3 git curl liblz4-tool zlib1g-dev libxml2-utils rsync unzip gawk cpio lz4 lzop pahole dwarves coreutils procps

      - name: Configure Git and repo
        run: |
          git config --global user.email "bot@kernelsu.org"
          git config --global user.name "KernelSUBot"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: Initialize repo and sync
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          repo init -u https://github.com/OnePlusOSS/kernel_manifest.git -b oneplus/sm8475 -m oneplus_ace2_b.xml --repo-rev=stable --depth=1 --no-clone-bundle --no-tags
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync

          for dir in kernel_platform/common kernel_platform/msm-kernel; do
            rm -f "$dir/android/abi_gki_protected_exports_"* 2>/dev/null || true
          done
          
      - name: Set Toolchain Path
        run: |
          CLANG_BIN="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"
          echo "$CLANG_BIN" >> $GITHUB_PATH
        
      - name: Modify modpost.c
        working-directory: kernel_workspace/kernel_platform/common
        run: |
          MODPOST=scripts/mod/modpost.c
          sed -i 's/^\(\s*check_exports(mod);\)/\/\/\1/' $MODPOST
          sed -i 's/^\(\s*s->module = exp->module;\)/\/\/\1/' $MODPOST

      - name: Build All Required Modules
        working-directory: kernel_workspace/kernel_platform/common
        run: |
          K_ARGS="O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-android- CLANG_TRIPLE=aarch64-linux-gnu-"

          make $K_ARGS gki_defconfig
          
          ./scripts/config --file out/.config -e CONFIG_MODULES
          
          # IPSET 核心及算法以及NETFILTER_XT
          ./scripts/config --file out/.config -m CONFIG_IP_SET -m CONFIG_IP_SET_BITMAP_IP -m CONFIG_IP_SET_BITMAP_IPMAC -m CONFIG_IP_SET_BITMAP_PORT -m CONFIG_IP_SET_HASH_IP -m CONFIG_IP_SET_HASH_IPMARK -m CONFIG_IP_SET_HASH_IPPORT -m CONFIG_IP_SET_HASH_IPPORTIP -m CONFIG_IP_SET_HASH_IPPORTNET -m CONFIG_IP_SET_HASH_IPMAC -m CONFIG_IP_SET_HASH_MAC -m CONFIG_IP_SET_HASH_NETPORTNET -m CONFIG_IP_SET_HASH_NET -m CONFIG_IP_SET_HASH_NETNET -m CONFIG_IP_SET_HASH_NETPORT -m CONFIG_IP_SET_HASH_NETIFACE -m CONFIG_IP_SET_LIST_SET --set-val CONFIG_IP_SET_MAX 65534 -m CONFIG_NETFILTER_XT_MATCH_ADDRTYPE -m CONFIG_NETFILTER_XT_SET
          
          make $K_ARGS olddefconfig
          make $K_ARGS modules_prepare
          
          make $K_ARGS M=net/netfilter modules
      
      - name: Make IPSET-LKM
        run: |
          git clone --depth 1 https://github.com/TanakaLun/IP-SET_LKM.git
          rm -rf .git
          mv kernel_workspace/kernel_platform/common/out/net/netfilter/*.ko ./IP-SET_LKM
          mv kernel_workspace/kernel_platform/common/out/net/netfilter/ipset/*.ko ./IP-SET_LKM
          zip -q -r ./IPSET-LKM.zip ./IP-SET_LKM/*
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPSET-LKM
          path: IPSET-LKM.zip

      - name: Get bot script
        uses: actions/checkout@v4
        with:
          path: bot

      - name: Upload to telegram group
        run: |
          if [ ! -z "${{ secrets.BOT_TOKEN }}" ]; then
            cd final_output

            zip -q -r ../IPSET-LKM.zip ./*
            cd ..
            pip3 install telethon
            python3 ./bot/Tools/ko.py ./IPSET-LKM.zip
          fi
        env:
          CHATID: ${{secrets.CHATID}}
          BOT_TOKEN: ${{secrets.BOT_TOKEN}}
          MESSAGE_THREAD_ID: ${{secrets.MESSAGE_THREAD_ID}} 